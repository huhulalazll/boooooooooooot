name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download rootfs (808MB)
        run: |
          mkdir -p app/src/main/assets
          curl -L --retry 5 --retry-delay 10 --retry-all-errors \
            -o app/src/main/assets/rootfs.tar.zst \
            "https://github.com/huhulalazll/boooooooooooot/releases/download/v1.0.0-rootfs/rootfs.tar.zst"
          ls -lh app/src/main/assets/rootfs.tar.zst

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qqbot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/debug/
